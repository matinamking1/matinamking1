name: Generate Snake Animation

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/main.yml
      - scripts/activity.cjs
      - scripts/snake.cjs

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch the same owner calendar used by the dashboard
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: node scripts/activity.cjs --export-calendar "${{ runner.temp }}/contribution-calendar.json"
      - name: Generate both snake themes
        run: node scripts/snake.cjs "${{ runner.temp }}/contribution-calendar.json" dist
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
